<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B0E14">
<title>CCOnklusyon Usher Scanner</title>
<!--
  CCOnklusyon Registration & Check-in System — Usher Scanner PWA (D-2)
  Epic 3 / Stories 3.1-3.4 (see AGENTS.md / Sprint Backlog doc for the full spec)

  Single-file HTML/JS/CSS, zero build step, per the Zero-Build Mandate. Deploy as-is via
  GitHub Pages. Wires to the live Code.gs API contract:
    POST {action:"checkin", attendance_code, device_id} -> SUCCESS | DUPLICATE | NOT_FOUND
    POST {action:"sync", items:[...]}                    -> bulk offline-queue flush
    GET  ?action=roster                                  -> full attendee list, cached client-side
                                                             for offline VIP identification
  html5-qrcode loaded from jsdelivr per Story 3.1.1 (spec explicitly calls for "via CDN").

  Layout: a fixed-height (100dvh) app shell — top bar, camera viewport that takes whatever height is
  left, and a bottom dock. Nothing sits below the fold, so every control is always reachable
  regardless of phone size or browser toolbars.

  Before using: set CONFIG.API_BASE below to the live /exec URL (same one Code.gs was
  contract-tested against). Uses the browser's own fetch() redirect handling, which already
  does what the manual curl workaround used during Epic 1 testing did (follow the /exec ->
  googleusercontent redirect automatically) — no special redirect code needed here.
-->
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --gold: #B8860B; --blue: #1A56DB;
    --green: #16A34A; --amber: #D97706; --red: #DC2626;
    --bg: #0B0E14; --panel: #151A24; --panel-2: #1D2431; --line: #2A3142;
    --text: #F3F4F6; --muted: #9CA3AF;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; background: var(--bg); }
  body {
    color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; border: none; cursor: pointer; }

  /* ---- App shell: header / camera (flex:1) / dock. No page scroll, nothing below the fold. ---- */
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; width: 100%; }

  #offlineBanner {
    flex: 0 0 auto; background: var(--amber); color: #1A1200; font-weight: 700; text-align: center;
    padding: calc(6px + env(safe-area-inset-top)) 10px 6px; font-size: 12px; letter-spacing: .2px;
  }
  #topbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 46px;
    padding: 6px 10px 6px 12px; padding-top: calc(6px + env(safe-area-inset-top));
    background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12px;
  }
  #offlineBanner:not([hidden]) + #topbar { padding-top: 6px; }
  .station { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1 1 auto; font-weight: 700; }
  .station b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: 0 0 auto;
    box-shadow: 0 0 0 0 rgba(22,163,74,.6); animation: dotPulse 2.4s ease-out infinite; }
  .dot.warn { background: var(--amber); box-shadow: 0 0 0 0 rgba(217,119,6,.6); }
  @keyframes dotPulse { 70% { box-shadow: 0 0 0 7px rgba(22,163,74,0); } 100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); } }
  .dot.warn { animation-name: dotPulseWarn; }
  @keyframes dotPulseWarn { 70% { box-shadow: 0 0 0 7px rgba(217,119,6,0); } 100% { box-shadow: 0 0 0 0 rgba(217,119,6,0); } }
  .pill {
    flex: 0 0 auto; padding: 4px 9px; border-radius: 999px; background: var(--panel-2);
    color: var(--muted); font-weight: 600; font-size: 11px; white-space: nowrap;
    transition: background .25s, color .25s, transform .25s var(--ease);
  }
  .pill.bump { transform: scale(1.18); background: var(--green); color: #fff; }
  .pill.attn { background: var(--amber); color: #1A1200; }
  .icon-btn { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; background: var(--panel-2); font-size: 17px; }
  .icon-btn:active { transform: scale(.94); }

  /* ---- Camera viewport ---- */
  #viewport { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; background: #000; }
  #reader { position: absolute; inset: 0; width: 100%; height: 100%; border: none !important; padding: 0 !important; }
  /* html5-qrcode injects fixed-pixel <video>/<canvas> plus its own shaded overlay. Force the video to
     fill the viewport (cover), hide the library chrome — we draw our own reticle below. */
  #reader > div, #reader__scan_region { width: 100% !important; height: 100% !important; min-height: 0 !important; }
  #reader video { width: 100% !important; height: 100% !important; object-fit: cover; display: block; }
  #reader canvas, #reader #qr-shaded-region, #reader img { display: none !important; }

  #readerPaused {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; text-align: center; padding: 24px; color: var(--muted); font-size: 14px; line-height: 1.5;
    background: radial-gradient(circle at 50% 40%, #1a2130, var(--bg) 70%);
  }
  #readerPaused .big { font-size: 40px; }

  .reticle { position: absolute; left: 50%; top: 50%; width: min(68vw, 46dvh, 320px); aspect-ratio: 1;
    transform: translate(-50%, -50%); pointer-events: none; }
  .reticle .mask { position: absolute; inset: 0; border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.42); }
  .reticle i { position: absolute; width: 30px; height: 30px; border: 4px solid rgba(255,255,255,.92);
    transition: border-color .2s, transform .25s var(--ease); }
  .reticle i:nth-of-type(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 18px; }
  .reticle i:nth-of-type(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 18px; }
  .reticle i:nth-of-type(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 18px; }
  .reticle i:nth-of-type(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 18px; }
  .scanline { position: absolute; left: 8%; right: 8%; top: 8%; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #4ADE80, transparent); box-shadow: 0 0 14px #4ADE80;
    animation: scan 1.9s ease-in-out infinite alternate; }
  @keyframes scan { from { top: 8%; } to { top: 92%; } }
  .reticle.ok i { border-color: var(--green); }
  .reticle.dup i { border-color: var(--amber); }
  .reticle.err i { border-color: var(--red); }
  .reticle.vip i { border-color: #FBBF24; }
  .reticle.pulse i { animation: cornerPop .55s var(--ease); }
  @keyframes cornerPop { 40% { transform: scale(1.35); } }
  .reticle.locked .scanline { opacity: 0; }

  .viewport-chip {
    position: absolute; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 999px;
    background: rgba(0,0,0,.6); backdrop-filter: blur(6px); font-size: 12px; font-weight: 600; white-space: nowrap;
    max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis;
  }
  #hint { bottom: 14px; color: #E5E7EB; }
  #unlockHint { top: 12px; background: rgba(217,119,6,.92); color: #1A1200; animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(-50%) translateY(3px); } }
  #toast { top: 12px; background: rgba(21,26,36,.94); border: 1px solid var(--line); opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s var(--ease); transform: translateX(-50%) translateY(-6px); }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #torchBtn { position: absolute; right: 12px; bottom: 12px; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(0,0,0,.6); backdrop-filter: blur(6px); font-size: 20px; }
  #torchBtn.on { background: #F59E0B; }

  /* ---- Bottom dock: always visible, safe-area aware ---- */
  #dock { flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px;
    color: var(--text); padding: 2px 2px; cursor: pointer; user-select: none; }
  .switch-row small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
  .switch { appearance: none; -webkit-appearance: none; flex: 0 0 auto; width: 46px; height: 28px; border-radius: 14px;
    background: #374151; position: relative; margin: 0; cursor: pointer; transition: background .2s; outline-offset: 3px; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; transition: transform .2s var(--ease); }
  .switch:checked { background: var(--green); }
  .switch:checked::after { transform: translateX(18px); }
  .dock-actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  .btn { padding: 15px 10px; border-radius: 12px; font-weight: 700; font-size: 15px; transition: transform .12s, background .2s; }
  .btn:active { transform: scale(.97); }
  .btn.secondary { background: #374151; }
  .btn.primary { background: var(--blue); }
  .btn:disabled { opacity: .55; }
  #manualPanel { display: flex; gap: 10px; animation: rise .25s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #manualCode { flex: 1; min-width: 0; font-size: 22px; letter-spacing: 4px; padding: 12px; border-radius: 12px;
    border: 1px solid #374151; background: var(--bg); color: var(--text); text-align: center; }
  #manualCode:focus { outline: 2px solid var(--blue); border-color: transparent; }
  #manualSubmit { flex: 0 0 auto; padding: 0 20px; background: var(--blue); border-radius: 12px; font-weight: 700; }

  /* Short screens (landscape phones, small devices): tighten the chrome so the camera keeps room. */
  @media (max-height: 560px) {
    #topbar { min-height: 40px; }
    .btn { padding: 11px 8px; font-size: 14px; }
    #dock { gap: 6px; padding-top: 6px; }
    .switch-row small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scanline, .dot, #unlockHint { animation: none; }
  }

  /* ---- Full-screen state flash (Story 3.2.2) — soft radial pulse, not a hard strobe ---- */
  #flash { position: fixed; inset: 0; opacity: 0; pointer-events: none; z-index: 30;
    transition: opacity 420ms var(--ease); }
  #flash.show { opacity: 0.6; transition-duration: 140ms; }
  #flash.green { background: radial-gradient(circle at 50% 40%, var(--green), transparent 74%); }
  #flash.amber { background: radial-gradient(circle at 50% 40%, var(--amber), transparent 74%); }
  #flash.red   { background: radial-gradient(circle at 50% 40%, var(--red), transparent 74%); }
  #flash.gold  { background: radial-gradient(circle at 50% 40%, #FBBF24, transparent 74%); }

  /* ---- Result modal (Story 3.3.2 / feedback layer) ---- */
  #resultModal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); padding: 16px; animation: fadeIn .18s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .card { position: relative; width: 100%; max-width: 420px; max-height: calc(100dvh - 32px); overflow-y: auto;
    background: #fff; color: #111827; border-radius: 18px; text-align: center; animation: cardIn 240ms var(--ease); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }
  .card.duplicate { animation: cardIn 240ms var(--ease), dupPulse 900ms ease-in-out 1; border: 3px solid var(--amber); }
  @keyframes dupPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(217,119,6,0); } 30% { box-shadow: 0 0 0 10px rgba(217,119,6,.35); } 60% { box-shadow: 0 0 0 0 rgba(217,119,6,0); } }
  .card.vip { box-shadow: 0 0 0 3px #FBBF24, 0 0 34px rgba(184,134,11,.55); }
  .card .tier-bar { padding: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; font-size: 13px; color: #fff; }
  .card .tier-bar.duplicate-bar { background: var(--amber) !important; }
  .dismiss-bar { height: 4px; background: rgba(0,0,0,.12); overflow: hidden; }
  .dismiss-bar::after { content: ''; display: block; height: 100%; width: 100%; background: #111827;
    transform-origin: left; animation: dismissBar linear forwards; animation-duration: inherit; }
  @keyframes dismissBar { to { transform: scaleX(0); } }
  .card .body { padding: 20px 18px 22px; }
  .card .warn-icon, .card .vip-star { font-size: 30px; line-height: 1; margin-bottom: 4px; }
  .card .name { font-size: 24px; font-weight: 800; margin: 0 0 4px; overflow-wrap: anywhere; }
  .card .sub { font-size: 14px; color: #4B5563; margin: 0 0 14px; }
  .card .seat { display: inline-block; padding: 7px 18px; border-radius: 20px; background: #F3F4F6; font-size: 14px; font-weight: 700; color: #111827; }
  .card .msg { font-size: 17px; font-weight: 800; margin: 0 0 6px; }
  .card .first-seen { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 20px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 700; }
  .card .offline-note { display: block; margin-top: 14px; font-size: 12px; color: #92400E; background: #FEF3C7; border-radius: 8px; padding: 8px 10px; }
  .card.error .body { padding-top: 26px; }
  .card button.close { display: block; width: calc(100% - 36px); margin: 0 18px 18px; padding: 14px; border-radius: 12px; background: #111827; color: #fff; font-weight: 700; }

  /* ---- Settings sheet ---- */
  #settingsBackdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); animation: fadeIn .18s ease-out; }
  #settingsSheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-height: 88dvh; overflow-y: auto;
    background: var(--panel); border-radius: 20px 20px 0 0; padding: 8px 16px calc(18px + env(safe-area-inset-bottom));
    animation: sheetUp .28s var(--ease); max-width: 560px; margin: 0 auto; }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: #374151; margin: 4px auto 12px; }
  .sheet-title { font-size: 15px; font-weight: 800; margin: 0 0 8px; }
  .setting { padding: 12px 0; border-top: 1px solid var(--line); }
  .setting:first-of-type { border-top: none; }
  .setting .label { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg button { padding: 11px 6px; border-radius: 10px; background: var(--panel-2); font-weight: 700; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .sheet-actions .btn { padding: 12px 8px; font-size: 13px; background: var(--panel-2); }
  .sheet-actions .wide { grid-column: 1 / -1; }
  .tiny { color: var(--muted); font-size: 11px; margin-top: 10px; word-break: break-all; }
</style>
</head>
<body>
<div id="app">
  <div id="offlineBanner" hidden>OFFLINE — scans are queued locally and sync automatically</div>

  <header id="topbar">
    <div class="station"><span id="netDot" class="dot"></span><b id="stationLabel">—</b></div>
    <span id="scanCount" class="pill" title="Check-ins from this device this session">✓ 0</span>
    <span id="queueBadge" class="pill" title="Scans waiting to sync">Queue 0</span>
    <span id="rosterBadge" class="pill" title="Cached roster for offline VIP identification">👥 —</span>
    <button id="menuBtn" class="icon-btn" aria-label="Settings">⚙️</button>
  </header>

  <section id="viewport">
    <div id="reader"></div>
    <div id="readerPaused" hidden>
      <div class="big">📷</div>
      <div>Camera paused to save battery.<br>Tap <b>Camera on</b> or use <b>Enter code</b>.</div>
    </div>
    <div id="reticle" class="reticle" aria-hidden="true">
      <div class="mask"></div><i></i><i></i><i></i><i></i><span class="scanline"></span>
    </div>
    <div id="hint" class="viewport-chip">Point the camera at the QR code</div>
    <div id="unlockHint" class="viewport-chip">👆 Tap once to enable sound &amp; vibration</div>
    <div id="toast" class="viewport-chip" role="status"></div>
    <button id="torchBtn" aria-label="Flashlight" hidden>🔦</button>
  </section>

  <footer id="dock">
    <div id="manualPanel" hidden>
      <input id="manualCode" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="5-digit code" autocomplete="off">
      <button id="manualSubmit">Validate</button>
    </div>
    <label id="continuousLabel" class="switch-row">
      <span>Keep scanning while a result card is showing
        <small>Skips the pause between scans — for fast lines</small></span>
      <input type="checkbox" class="switch" role="switch" id="continuousScanCheckbox">
    </label>
    <div class="dock-actions">
      <button id="cameraToggleBtn" class="btn secondary">📷 Camera off</button>
      <button id="manualBtn" class="btn primary">⌨️ Enter code</button>
    </div>
  </footer>
</div>

<div id="flash"></div>
<div id="resultModal" hidden></div>

<div id="settingsBackdrop" hidden></div>
<div id="settingsSheet" role="dialog" aria-label="Scanner settings" hidden>
  <div class="grab"></div>
  <p class="sheet-title">Scanner settings</p>
  <div class="setting">
    <div class="label">Sound</div>
    <div class="seg" id="volumeSeg">
      <button data-v="off" aria-pressed="false">🔇 Off</button>
      <button data-v="normal" aria-pressed="false">🔉 Normal</button>
      <button data-v="loud" aria-pressed="false">🔊 Loud</button>
    </div>
  </div>
  <label class="setting switch-row">
    <span>Haptic feedback<small id="hapticNote">Vibrates on every result (Android). iPhones don't support web vibration.</small></span>
    <input type="checkbox" class="switch" role="switch" id="hapticsToggle">
  </label>
  <label class="setting switch-row">
    <span>Auto-dismiss result cards<small>Successful check-ins close themselves (VIPs stay longer)</small></span>
    <input type="checkbox" class="switch" role="switch" id="autoDismissToggle">
  </label>
  <div class="setting">
    <div class="sheet-actions">
      <button class="btn wide" id="testFeedbackBtn">🔔 Test sound &amp; vibration</button>
      <button class="btn" id="refreshRosterBtn">🔄 Refresh roster</button>
      <button class="btn" id="syncNowBtn">⏫ Sync now</button>
      <button class="btn wide" id="changeStationBtn">✏️ Change station name</button>
      <button class="btn wide" id="closeSettingsBtn" style="background:var(--blue)">Done</button>
    </div>
    <div class="tiny" id="apiNote"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---- CONFIG -----------------------------------------------------------------------
  const CONFIG = {
    // Live Code.gs /exec URL (Epic 1, contract-tested). Update if the deployment changes.
    // Updated Sept 19, 5:08 PM to the Version 4 deployment (the newest one made with "+ New
    // deployment" during the roster-endpoint redeploy). IMPORTANT: from now on, use
    // "Manage deployments" -> pencil/edit icon on THIS deployment -> Version: New version ->
    // Deploy to ship code changes — that keeps this same URL live. "+ New deployment" makes an
    // entirely different URL, which is exactly what caused the roster/offline-sync mismatch
    // this fixes (scanner.html was still pointed at the original Epic-1 URL while Code.gs kept
    // getting redeployed to new ones).
    API_BASE: 'https://script.google.com/macros/s/AKfycbyUZywdnh62McTK-FJwHlu5ltnrzWI6dnc1v1HMxNwG2PPM1vJO-xsXCz5T-rNrVPVi/exec',
    SCAN_FREEZE_MS: 2000,       // Story 3.1.3
    AUTO_SYNC_INTERVAL_MS: 15000,
    ROSTER_REFRESH_INTERVAL_MS: 5 * 60 * 1000, // 5 min — roster changes rarely mid-event
    AUTO_DISMISS_MS: 2500,      // regular check-in card
    AUTO_DISMISS_VIP_MS: 5000,  // VIP card stays longer so the usher can read it
    TIER_COLORS: {
      'VIP Pass': '#B8860B',
      'Regular Attendee': '#1A56DB'
    },
    DEVICE_ID_KEY: 'cco_device_id',
    OFFLINE_QUEUE_KEY: 'cco_offline_scans',
    ROSTER_CACHE_KEY: 'cco_roster_cache',
    SETTINGS_KEY: 'cco_scanner_settings'
  };

  const $ = function (id) { return document.getElementById(id); };

  // ---- Settings (persisted per device) --------------------------------------------------
  const DEFAULT_SETTINGS = { volume: 'loud', haptics: true, autoDismiss: true, continuous: false };
  function loadSettings() {
    try { return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(localStorage.getItem(CONFIG.SETTINGS_KEY) || '{}')); }
    catch (e) { return Object.assign({}, DEFAULT_SETTINGS); }
  }
  const settings = loadSettings();
  function saveSettings() {
    try { localStorage.setItem(CONFIG.SETTINGS_KEY, JSON.stringify(settings)); } catch (e) { /* storage blocked */ }
  }

  // ---- Small UI helpers -----------------------------------------------------------------
  let toastTimer = null;
  function showToast(msg, ms) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 2200);
  }
  function bump(el) {
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    setTimeout(function () { el.classList.remove('bump'); }, 320);
  }

  // ---- Device / station id -----------------------------------------------------------
  function askStationName() {
    const id = (prompt('Usher station / device name (e.g. "Entrance-1"):') || '').trim() || 'Unassigned-Station';
    localStorage.setItem(CONFIG.DEVICE_ID_KEY, id);
    return id;
  }
  function getDeviceId() {
    return localStorage.getItem(CONFIG.DEVICE_ID_KEY) || askStationName();
  }
  let deviceId = getDeviceId();
  $('stationLabel').textContent = deviceId;

  // ---- Offline queue (Story 3.4) ------------------------------------------------------
  function readQueue() {
    try { return JSON.parse(localStorage.getItem(CONFIG.OFFLINE_QUEUE_KEY) || '[]'); }
    catch (e) { return []; }
  }
  function writeQueue(q) {
    localStorage.setItem(CONFIG.OFFLINE_QUEUE_KEY, JSON.stringify(q));
    updateQueueUi();
  }
  function queueOffline(item) {
    const q = readQueue();
    q.push(item);
    writeQueue(q);
  }
  function updateQueueUi() {
    const n = readQueue().length;
    const offline = !navigator.onLine;
    const badge = $('queueBadge');
    badge.textContent = 'Queue ' + n;
    badge.classList.toggle('attn', n > 0);
    $('offlineBanner').hidden = n === 0 && !offline;
    $('netDot').classList.toggle('warn', offline || n > 0);
  }

  // Returns the number of queued scans flushed, or null if nothing was sent.
  async function trySyncOfflineQueue() {
    const q = readQueue();
    if (q.length === 0 || !navigator.onLine) return null;
    try {
      const res = await fetch(CONFIG.API_BASE, {
        method: 'POST',
        body: JSON.stringify({ action: 'sync', items: q })
      });
      const json = await res.json();
      if (json && json.status === 'SUCCESS') {
        writeQueue([]); // whole batch flushed — Code.gs handleSync_ processes every item
        return q.length;
      }
    } catch (err) {
      // still offline or endpoint unreachable — leave queue intact, retry later
    }
    return null;
  }
  window.addEventListener('online', function () { trySyncOfflineQueue(); updateQueueUi(); });
  window.addEventListener('offline', updateQueueUi);
  setInterval(trySyncOfflineQueue, CONFIG.AUTO_SYNC_INTERVAL_MS);

  // ---- Roster cache — lets a scan be identified (name/tier/table) even with no connection.
  // Without this, an offline scan can only be queued blind: the usher has no way to tell a VIP
  // from a Regular Attendee until the sync catches up, which defeats the door's main job of
  // fast VIP recognition. Fetched while online, read from localStorage when offline; keyed by
  // attendance_code. Requires Code.gs to expose GET ?action=roster (see AGENTS.md).
  function readRosterCache() {
    try { return JSON.parse(localStorage.getItem(CONFIG.ROSTER_CACHE_KEY) || 'null'); }
    catch (e) { return null; }
  }
  function lookupRoster(code) {
    const cache = readRosterCache();
    return (cache && cache.byCode && cache.byCode[code]) || null;
  }
  function updateRosterBadge() {
    const cache = readRosterCache();
    const el = $('rosterBadge');
    el.classList.remove('attn');
    if (!cache) { el.textContent = '👥 —'; return; }
    const n = Object.keys(cache.byCode || {}).length;
    const t = new Date(cache.syncedAt);
    const hh = String(t.getHours()).padStart(2, '0'), mm = String(t.getMinutes()).padStart(2, '0');
    el.textContent = '👥 ' + n + ' · ' + hh + ':' + mm;
  }
  // Returns 'ok' | 'unsupported' | 'offline'.
  async function fetchRoster() {
    if (!navigator.onLine) return 'offline';
    try {
      const res = await fetch(CONFIG.API_BASE + '?action=roster');
      const json = await res.json();
      if (json && json.status === 'SUCCESS' && Array.isArray(json.attendees)) {
        const byCode = {};
        json.attendees.forEach(function (a) {
          if (a.attendance_code) byCode[String(a.attendance_code)] = a;
        });
        localStorage.setItem(CONFIG.ROSTER_CACHE_KEY, JSON.stringify({ byCode: byCode, syncedAt: new Date().toISOString() }));
        updateRosterBadge();
        return 'ok';
      }
      // The deployed Apps Script doesn't recognize ?action=roster yet — most likely Code.gs
      // was updated but not redeployed (Deploy > Manage deployments > Edit > New version).
      // Surfaced in the badge instead of failing silently, so this is diagnosable from the
      // phone alone instead of looking like "offline mode is just broken."
      const el = $('rosterBadge');
      el.textContent = '👥 ⚠ redeploy Code.gs';
      el.classList.add('attn');
      return 'unsupported';
    } catch (err) {
      // offline or endpoint unreachable — keep whatever cache is already there
      return 'offline';
    }
  }
  window.addEventListener('online', fetchRoster);
  setInterval(fetchRoster, CONFIG.ROSTER_REFRESH_INTERVAL_MS);

  // ---- Feedback layer: audio (Story 3.2.1), made louder + longer ------------------------
  // Same spec frequencies (800→1200 success, 440 duplicate, 200 error) but with a harder
  // waveform, an octave harmonic, repeated beeps, and a compressor so it cuts through a noisy room.
  // Web Audio needs a user gesture to start — see unlockFeedback() below.
  let audioCtx = null, masterGain = null;
  const VOLUME = { off: 0, normal: 0.55, loud: 1 };
  function ensureAudioCtx() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        audioCtx = new Ctx();
        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 10;
        comp.attack.value = 0.003; comp.release.value = 0.12;
        masterGain = audioCtx.createGain();
        masterGain.connect(comp);
        comp.connect(audioCtx.destination);
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  // One sweep: `offset` seconds from now, freq f0→f1 over `dur` seconds, plus a quieter octave-up sine.
  function note(offset, f0, f1, dur, type, gain) {
    const t = audioCtx.currentTime + offset;
    [[type, 1, gain], ['sine', 2, gain * 0.55]].forEach(function (v) {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = v[0];
      osc.frequency.setValueAtTime(f0 * v[1], t);
      if (f1 !== f0) osc.frequency.linearRampToValueAtTime(f1 * v[1], t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v[2], t + 0.01);
      g.gain.setValueAtTime(v[2], t + dur * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t + dur + 0.03);
    });
  }
  function playFeedbackTone(kind) {
    const vol = VOLUME[settings.volume];
    if (!vol) return;
    const ctx = ensureAudioCtx();
    if (!ctx) return;
    masterGain.gain.value = vol;
    if (kind === 'success') {            // double rising chirp
      note(0, 800, 1200, 0.16, 'square', 0.42);
      note(0.2, 800, 1200, 0.16, 'square', 0.42);
    } else if (kind === 'vip') {         // three-step fanfare so a VIP is unmistakable by ear
      note(0, 800, 1200, 0.15, 'square', 0.42);
      note(0.18, 1000, 1500, 0.15, 'square', 0.42);
      note(0.36, 1200, 1800, 0.34, 'square', 0.46);
    } else if (kind === 'duplicate') {   // two flat mid beeps
      note(0, 440, 440, 0.2, 'square', 0.45);
      note(0.28, 440, 440, 0.2, 'square', 0.45);
    } else {                             // error / not found — two low buzzes
      note(0, 200, 200, 0.34, 'sawtooth', 0.6);
      note(0.42, 200, 200, 0.34, 'sawtooth', 0.6);
    }
  }

  // ---- Feedback layer: haptics ------------------------------------------------------------
  // Web Vibration API: Android Chrome/Firefox only — iOS Safari doesn't implement it, so iPhones
  // get sound + visuals only. Chrome also ignores vibrate() until the page has had a tap.
  const HAPTIC = {
    success: [90],
    vip: [90, 60, 90, 60, 260],
    duplicate: [150, 90, 150],
    error: [420, 120, 420]
  };
  function haptic(kind) {
    if (!settings.haptics || !navigator.vibrate) return;
    try { navigator.vibrate(HAPTIC[kind] || HAPTIC.success); } catch (e) { /* unsupported */ }
  }
  function feedback(kind) { playFeedbackTone(kind); haptic(kind); }

  // Browsers block audio and vibration until the user has tapped the page once. The camera starts on
  // load with no tap, so prompt for one instead of letting the first scan silently be quiet.
  let feedbackUnlocked = false;
  function unlockFeedback() {
    if (feedbackUnlocked) return;
    feedbackUnlocked = true;
    ensureAudioCtx();
    if (settings.haptics && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* ignore */ } }
    $('unlockHint').hidden = true;
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, unlockFeedback, { passive: true });
  });

  // ---- Feedback layer: full-screen flash (Story 3.2.2) + reticle reaction -------------------
  function flashScreen(color) {
    const el = $('flash');
    el.className = color; // set color first so the transition has a starting point
    // next frame: fade in fast, hold briefly, then the slower fade-out handles the rest —
    // one smooth in-hold-out pulse instead of an abrupt on/off strobe.
    requestAnimationFrame(function () {
      el.classList.add('show');
      setTimeout(function () { el.classList.remove('show'); }, 200);
    });
  }
  let reticleTimer = null;
  function reactReticle(kind) { // 'ok' | 'dup' | 'err' | 'vip'
    const r = $('reticle');
    r.classList.remove('ok', 'dup', 'err', 'vip', 'pulse');
    void r.offsetWidth;
    r.classList.add(kind, 'pulse');
    clearTimeout(reticleTimer);
    reticleTimer = setTimeout(function () { r.classList.remove('ok', 'dup', 'err', 'vip', 'pulse'); }, 1100);
  }

  // ---- Result modal (tier-colored, Story 3.3.2) ---------------------------------------
  let continuousScan = !!settings.continuous;
  const continuousScanCheckbox = $('continuousScanCheckbox');
  continuousScanCheckbox.checked = continuousScan;
  continuousScanCheckbox.addEventListener('change', function () {
    continuousScan = continuousScanCheckbox.checked;
    settings.continuous = continuousScan;
    saveSettings();
    showToast(continuousScan ? 'Fast mode on — scanning continues behind result cards' : 'Fast mode off — scanning pauses while a card is open');
  });

  let dismissTimer = null;
  let sessionCount = 0;
  function isModalOpen() { return !$('resultModal').hidden; }
  function closeModal() {
    clearTimeout(dismissTimer);
    $('resultModal').hidden = true;
  }
  $('resultModal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

  function showResultModal(status, data, message) {
    const modal = $('resultModal');
    let html;
    let autoMs = 0;
    const isVip = data && data.ticket_type === 'VIP Pass';
    const bar = function (ms) { return '<div class="dismiss-bar" style="animation-duration:' + ms + 'ms"></div>'; };

    if (status === 'SUCCESS') {
      const tier = data.ticket_type || 'Regular Attendee';
      const color = CONFIG.TIER_COLORS[tier] || CONFIG.TIER_COLORS['Regular Attendee'];
      if (settings.autoDismiss) autoMs = isVip ? CONFIG.AUTO_DISMISS_VIP_MS : CONFIG.AUTO_DISMISS_MS;
      html =
        '<div class="card' + (isVip ? ' vip' : '') + '"><div class="tier-bar" style="background:' + color + '">' + escapeHtml_(tier) + '</div>' +
        (autoMs ? bar(autoMs) : '') +
        '<div class="body">' +
        (isVip ? '<div class="vip-star">⭐</div>' : '') +
        '<p class="msg" style="color:' + color + '">CHECKED IN</p>' +
        '<p class="name">' + escapeHtml_(data.full_name || '') + '</p>' +
        '<p class="sub">' + escapeHtml_(data.designation || '') + (data.club_name ? ' · ' + escapeHtml_(data.club_name) : '') + '</p>' +
        (data.table_allocation ? '<span class="seat">Table/Seat: ' + escapeHtml_(data.table_allocation) + '</span>' : '') +
        '</div><button class="close" onclick="cco_closeModal()">Next scan</button></div>';
    } else if (status === 'DUPLICATE') {
      // Deliberately distinct from SUCCESS regardless of tier color — an amber bar, warning
      // icon, and a one-shot pulse ring, so a duplicate reads unmistakably differently from a
      // fresh check-in at a glance (the earlier plain color-swap was too subtle per usher testing).
      html =
        '<div class="card duplicate"><div class="tier-bar duplicate-bar">DUPLICATE SCAN</div>' +
        '<div class="body">' +
        '<div class="warn-icon">⚠️</div>' +
        '<p class="msg" style="color:var(--amber)">ALREADY CHECKED IN</p>' +
        '<p class="name">' + escapeHtml_(data.full_name || '') + '</p>' +
        '<p class="sub">' + escapeHtml_(data.designation || '') + (data.club_name ? ' · ' + escapeHtml_(data.club_name) : '') + '</p>' +
        (data.table_allocation ? '<span class="seat">Table/Seat: ' + escapeHtml_(data.table_allocation) + '</span>' : '') +
        (data.initial_checkin_timestamp ? '<div><span class="first-seen">First checked in at ' + escapeHtml_(fmtTime(data.initial_checkin_timestamp)) + '</span></div>' : '') +
        '</div><button class="close" onclick="cco_closeModal()">Next scan</button></div>';
    } else if (status === 'QUEUED_OFFLINE') {
      // Roster-cache hit while offline (Story 3.4 mitigation): still shows the tier-colored
      // card so a VIP is visually identifiable at the door even with no connection — the
      // check-in write itself is queued and confirmed later on sync.
      const tier = data.ticket_type || 'Regular Attendee';
      const color = CONFIG.TIER_COLORS[tier] || CONFIG.TIER_COLORS['Regular Attendee'];
      const suspectDup = data.checkin_status === 'Checked-In';
      if (settings.autoDismiss && !suspectDup) autoMs = isVip ? CONFIG.AUTO_DISMISS_VIP_MS : CONFIG.AUTO_DISMISS_MS;
      html =
        '<div class="card' + (suspectDup ? ' duplicate' : (isVip ? ' vip' : '')) + '"><div class="tier-bar' + (suspectDup ? ' duplicate-bar' : '') + '" style="' + (suspectDup ? '' : 'background:' + color) + '">' + escapeHtml_(tier) + '</div>' +
        (autoMs ? bar(autoMs) : '') +
        '<div class="body">' +
        (isVip && !suspectDup ? '<div class="vip-star">⭐</div>' : '') +
        '<p class="msg" style="color:' + (suspectDup ? 'var(--amber)' : color) + '">' + (suspectDup ? 'MAY ALREADY BE CHECKED IN' : 'OFFLINE — QUEUED') + '</p>' +
        '<p class="name">' + escapeHtml_(data.full_name || '') + '</p>' +
        '<p class="sub">' + escapeHtml_(data.designation || '') + (data.club_name ? ' · ' + escapeHtml_(data.club_name) : '') + '</p>' +
        (data.table_allocation ? '<span class="seat">Table/Seat: ' + escapeHtml_(data.table_allocation) + '</span>' : '') +
        '<span class="offline-note">' + (suspectDup
          ? 'Per the last roster sync this code was already checked in — verify with the printed roster before letting them through again.'
          : 'No connection — identity is from the last cached roster sync. Check-in will be recorded once back online.') + '</span>' +
        '</div><button class="close" onclick="cco_closeModal()">Next scan</button></div>';
    } else if (status === 'QUEUED') {
      html =
        '<div class="card"><div class="body">' +
        '<p class="msg" style="color:var(--amber);">OFFLINE — CODE NOT IN CACHE</p>' +
        '<p class="sub">' + escapeHtml_(message || 'No connection and this code isn’t in the cached roster, so this attendee can’t be identified right now — including whether they’re VIP. Check the printed roster before letting them through.') + '</p>' +
        '</div><button class="close" onclick="cco_closeModal()">Next scan</button></div>';
    } else {
      html =
        '<div class="card error"><div class="body">' +
        '<p class="msg" style="color:#DC2626;">' + (status === 'NOT_FOUND' ? 'CODE NOT FOUND' : 'ERROR') + '</p>' +
        '<p class="sub">' + escapeHtml_(message || 'Check the code, or use the printed roster.') + '</p>' +
        '</div><button class="close" onclick="cco_closeModal()">Try again</button></div>';
    }

    clearTimeout(dismissTimer);
    modal.innerHTML = html;
    modal.hidden = false;
    if (autoMs) dismissTimer = setTimeout(closeModal, autoMs);
  }
  window.cco_closeModal = closeModal;

  function escapeHtml_(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Sheet timestamps are ISO 8601 (e.g. 2026-10-02T12:14:32+08:00) — show the time, not the raw string.
  function fmtTime(iso) {
    const d = new Date(iso);
    return isNaN(d) ? String(iso) : d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  }

  function countScan() {
    sessionCount++;
    const el = $('scanCount');
    el.textContent = '✓ ' + sessionCount;
    bump(el);
  }

  // ---- Core check-in call (shared by camera scan + manual PIN, Story 3.1.2 / 3.3) -----
  async function submitCheckin(code) {
    const payload = { action: 'checkin', attendance_code: code, device_id: deviceId };
    let json;
    try {
      const res = await fetch(CONFIG.API_BASE, { method: 'POST', body: JSON.stringify(payload) });
      json = await res.json();
    } catch (err) {
      // Network failure -> offline resilience (Story 3.4.1): queue and tell the usher
      // check-in will be confirmed once the connection returns, instead of blocking entry.
      queueOffline(payload);
      const cached = lookupRoster(code);
      if (cached) {
        // Roster cache hit: identify the attendee (tier/name/table) even offline (mitigation
        // for the "can't spot a VIP with no connection" gap).
        const suspectDup = cached.checkin_status === 'Checked-In';
        const vip = cached.ticket_type === 'VIP Pass';
        flashScreen(suspectDup ? 'amber' : (vip ? 'gold' : 'green'));
        reactReticle(suspectDup ? 'dup' : (vip ? 'vip' : 'ok'));
        feedback(suspectDup ? 'duplicate' : (vip ? 'vip' : 'success'));
        if (!suspectDup) countScan();
        showResultModal('QUEUED_OFFLINE', cached, null);
      } else {
        flashScreen('amber');
        reactReticle('dup');
        feedback('duplicate'); // neutral tone — not a hard error, not a confirmed success
        showResultModal('QUEUED', {}, null);
      }
      return;
    }

    if (json.status === 'SUCCESS') {
      const vip = json.data && json.data.ticket_type === 'VIP Pass';
      flashScreen(vip ? 'gold' : 'green');
      reactReticle(vip ? 'vip' : 'ok');
      feedback(vip ? 'vip' : 'success');
      countScan();
      showResultModal('SUCCESS', json.data, json.message);
    } else if (json.status === 'DUPLICATE') {
      flashScreen('amber');
      reactReticle('dup');
      feedback('duplicate');
      showResultModal('DUPLICATE', json.data, json.message);
    } else if (json.status === 'NOT_FOUND') {
      flashScreen('red');
      reactReticle('err');
      feedback('error');
      showResultModal('NOT_FOUND', {}, json.message);
    } else {
      flashScreen('red');
      reactReticle('err');
      feedback('error');
      showResultModal('ERROR', {}, json.message || 'Unexpected response.');
    }
  }

  // ---- Manual PIN fallback (Story 3.3) -------------------------------------------------
  const manualBtn = $('manualBtn');
  const manualPanel = $('manualPanel');
  const manualCode = $('manualCode');
  manualBtn.addEventListener('click', function () {
    manualPanel.hidden = !manualPanel.hidden;
    manualBtn.textContent = manualPanel.hidden ? '⌨️ Enter code' : '✕ Close keypad';
    if (!manualPanel.hidden) manualCode.focus();
  });
  $('manualSubmit').addEventListener('click', function () {
    const code = manualCode.value.trim();
    if (!code) return;
    ensureAudioCtx();
    submitCheckin(code);
    manualCode.value = '';
  });
  manualCode.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('manualSubmit').click();
  });

  // ---- Camera scan core (Story 3.1) ----------------------------------------------------
  let scanLocked = false;
  let cameraOn = false;
  const html5QrCode = new Html5Qrcode('reader', {
    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true } // native detector where available, JS fallback otherwise
  });
  const readerPausedEl = $('readerPaused');
  const reticleEl = $('reticle');
  const hintEl = $('hint');
  const torchBtn = $('torchBtn');
  const cameraToggleBtn = $('cameraToggleBtn');

  function onScanSuccess(decodedText) {
    if (scanLocked) return; // 2.0s scan-freeze debounce (Story 3.1.3)
    // Buffer fix: the camera keeps decoding in the background while the result card is on
    // screen, and the same QR is usually still sitting in frame — without this guard it would
    // re-trigger a second check-in the moment the 2s debounce lapsed, even before the usher had
    // read the first result. Default: don't scan again until that card is dismissed. The
    // "keep scanning" switch opts back into the always-on behavior (2s buffer only) for
    // ushers who prefer to just keep waving codes through a fast line.
    if (isModalOpen() && !continuousScan) return;
    if (!$('settingsSheet').hidden) return; // settings sheet is open — don't check anyone in behind it
    scanLocked = true;
    reticleEl.classList.add('locked');
    ensureAudioCtx();
    submitCheckin(decodedText.trim());
    setTimeout(function () { scanLocked = false; reticleEl.classList.remove('locked'); }, CONFIG.SCAN_FREEZE_MS);
  }

  function setCameraUi(on) {
    cameraOn = on;
    readerPausedEl.hidden = on;
    reticleEl.hidden = !on;
    hintEl.hidden = !on;
    if (!on) torchBtn.hidden = true;
    cameraToggleBtn.textContent = on ? '📷 Camera off' : '📷 Camera on';
  }

  function startCamera() {
    // No qrbox: the whole frame is decoded, so a code is picked up anywhere in view; the reticle
    // is guidance only. This also keeps decoding correct now that the video fills the viewport
    // with object-fit: cover (a fixed-pixel qrbox assumes the video isn't cropped).
    return html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10 },
      onScanSuccess,
      function () { /* per-frame decode miss — expected constantly, ignore */ }
    ).then(function () {
      setCameraUi(true);
      setupTorch();
    }).catch(function (err) {
      setCameraUi(false);
      readerPausedEl.querySelector('div:last-child').innerHTML = 'Camera unavailable.<br>Use <b>Enter code</b> to check people in.';
      cameraToggleBtn.textContent = '📷 Retry camera';
      showResultModal('ERROR', {}, 'Camera unavailable (' + err + '). Use manual code entry instead.');
      manualPanel.hidden = false;
      manualBtn.textContent = '✕ Close keypad';
    });
  }

  // Story: battery-saving camera toggle — ushers doing mostly manual/offline entry, or taking
  // a break from active scanning, can turn the camera off entirely rather than leaving it
  // running (a live camera + continuous decode loop is one of the biggest battery drains on a
  // phone left running for a multi-hour shift).
  function stopCamera() {
    return html5QrCode.stop().then(function () {
      setCameraUi(false);
      readerPausedEl.querySelector('div:last-child').innerHTML = 'Camera paused to save battery.<br>Tap <b>Camera on</b> or use <b>Enter code</b>.';
    }).catch(function () { /* already stopped — nothing to do */ });
  }

  cameraToggleBtn.addEventListener('click', function () {
    cameraToggleBtn.disabled = true;
    const p = cameraOn ? stopCamera() : startCamera();
    p.finally(function () { cameraToggleBtn.disabled = false; });
  });

  // ---- Flashlight toggle, feature-detected (Story 3.1.4) -------------------------------
  function setupTorch() {
    let torchOn = false;
    torchBtn.classList.remove('on');
    try {
      const caps = html5QrCode.getRunningTrackCameraCapabilities();
      const torchFeature = caps && caps.torchFeature && caps.torchFeature();
      if (torchFeature && torchFeature.isSupported && torchFeature.isSupported()) {
        torchBtn.hidden = false;
        torchBtn.onclick = function () {
          torchOn = !torchOn;
          torchFeature.apply(torchOn);
          torchBtn.classList.toggle('on', torchOn);
        };
      }
    } catch (e) {
      // torch not supported on this device/browser — button stays hidden, no functional loss
    }
  }

  // ---- Settings sheet ---------------------------------------------------------------------
  const settingsSheet = $('settingsSheet');
  const settingsBackdrop = $('settingsBackdrop');
  function openSettings() { settingsSheet.hidden = false; settingsBackdrop.hidden = false; }
  function closeSettings() { settingsSheet.hidden = true; settingsBackdrop.hidden = true; }
  $('menuBtn').addEventListener('click', openSettings);
  $('closeSettingsBtn').addEventListener('click', closeSettings);
  settingsBackdrop.addEventListener('click', closeSettings);

  function renderVolumeSeg() {
    document.querySelectorAll('#volumeSeg button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.v === settings.volume));
    });
  }
  document.querySelectorAll('#volumeSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      settings.volume = b.dataset.v;
      saveSettings(); renderVolumeSeg();
      ensureAudioCtx(); playFeedbackTone('success'); // audible preview at the chosen level
    });
  });
  renderVolumeSeg();

  const hapticsToggle = $('hapticsToggle');
  hapticsToggle.checked = settings.haptics;
  if (!navigator.vibrate) {
    hapticsToggle.disabled = true;
    $('hapticNote').textContent = 'Not supported by this browser (iPhones/iPads don’t allow web vibration).';
  }
  hapticsToggle.addEventListener('change', function () {
    settings.haptics = hapticsToggle.checked; saveSettings();
    if (settings.haptics) haptic('success');
  });

  const autoDismissToggle = $('autoDismissToggle');
  autoDismissToggle.checked = settings.autoDismiss;
  autoDismissToggle.addEventListener('change', function () {
    settings.autoDismiss = autoDismissToggle.checked; saveSettings();
  });

  $('testFeedbackBtn').addEventListener('click', function () {
    ensureAudioCtx();
    feedback('vip');
    showToast(settings.volume === 'off' ? 'Sound is off' : 'Played test tone' + (navigator.vibrate && settings.haptics ? ' + vibration' : ''));
  });

  // Manual override buttons — don't make anyone wait on the 15s/5min auto timers, or guess
  // whether caching/syncing "is working"; both give instant on-screen feedback either way.
  $('refreshRosterBtn').addEventListener('click', async function () {
    const btn = this;
    btn.disabled = true; btn.textContent = '🔄 Refreshing…';
    const r = await fetchRoster();
    btn.disabled = false; btn.textContent = '🔄 Refresh roster';
    const n = Object.keys((readRosterCache() || {}).byCode || {}).length;
    showToast(r === 'ok' ? 'Roster refreshed — ' + n + ' cached' : r === 'unsupported' ? 'Server has no roster endpoint — redeploy Code.gs' : 'Offline — using cached roster');
  });
  $('syncNowBtn').addEventListener('click', async function () {
    const btn = this;
    btn.disabled = true; btn.textContent = '⏫ Syncing…';
    const before = readQueue().length;
    const sent = await trySyncOfflineQueue();
    btn.disabled = false; btn.textContent = '⏫ Sync now';
    showToast(before === 0 ? 'Nothing to sync' : sent ? 'Synced ' + sent + ' queued scan' + (sent === 1 ? '' : 's') : 'Couldn’t sync yet — ' + before + ' still queued');
  });
  $('changeStationBtn').addEventListener('click', function () {
    deviceId = askStationName();
    $('stationLabel').textContent = deviceId;
    showToast('Station set to ' + deviceId);
  });
  $('apiNote').textContent = 'API …' + CONFIG.API_BASE.slice(-18);

  // ---- Init -----------------------------------------------------------------------------
  reticleEl.hidden = true; hintEl.hidden = true; // shown once the camera actually starts
  cameraToggleBtn.textContent = '📷 Starting…';
  updateQueueUi();
  updateRosterBadge();
  trySyncOfflineQueue();
  fetchRoster();
  startCamera();
})();
</script>
</body>
</html>
